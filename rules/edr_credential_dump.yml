# Rover Observatory — detection rule
# One rule per file. Filename must match stable_key.
stable_key: edr_credential_dump
name: Credential dumping tool behavior
description: Detects process and memory access patterns associated with credential dumping.
origin: modified_default
severity: critical
enabled: true

scope:
  type: source
  key: source:connector-edr
  source_pack_key: endpoint_telemetry
  source_name: Endpoint Telemetry

schedule:
  run_frequency_s: 300
  time_range_s: 3600
  dedupe_window_s: 3600
  lookback_grace_s: 180

mitre:
  tactics:
    - Credential Access
  techniques:
    - T1003

query: |
  source = 'endpoint_telemetry' and process.name in ('powershell.exe', 'rundll32.exe')

response:
  channel: "#db-ops"
  first_step: >-
    Isolate the host, capture the parent process tree, and check whether the
    account has authenticated anywhere else in the last hour.
